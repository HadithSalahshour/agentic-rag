name: Python checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q agent api eval ingestion retrieval scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
