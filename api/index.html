<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic RAG — FastAPI Docs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #faf9f7;
  --surface:  #f3f1ee;
  --surface2: #ebe8e3;
  --border:   #dedad4;
  --border2:  #ccc8c0;
  --ink:      #1c1a17;
  --ink2:     #5a554d;
  --ink3:     #9a9188;
  --accent:   #4f39f6;
  --accent2:  #ede9fe;
  --accent3:  #7c69f8;
  --green:    #15803d;
  --green-bg: #f0fdf4;
  --green-b:  #bbf7d0;
  --amber:    #92400e;
  --amber-bg: #fffbeb;
  --amber-b:  #fde68a;
  --red:      #b91c1c;
  --red-bg:   #fef2f2;
  --red-b:    #fecaca;
  --code-dark:#16151f;
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: 48px 1fr;
  height: 100vh;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: #fff;
}

.brand { display: flex; align-items: center; gap: 8px; }
.brand-name {
  font-size: 13px; font-weight: 700;
  color: var(--ink); letter-spacing: -0.02em;
}
.corpus-tag {
  font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: 4px;
  background: var(--accent2); color: var(--accent);
  letter-spacing: 0.01em;
}

.header-stats {
  display: flex; align-items: center; gap: 20px;
}
.hstat {
  font-size: 12px; color: var(--ink3);
  display: flex; align-items: center; gap: 5px;
}
.hstat b { color: var(--ink2); font-weight: 600; }
.live { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--green); font-weight: 500; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ── SIDEBAR ── */
aside {
  background: #fff;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-label {
  padding: 14px 16px 8px;
  font-size: 10px; font-weight: 700;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.history-scroll { flex: 1; overflow-y: auto; padding: 0 8px 8px; }

.h-item {
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 1px;
  border: 1px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
.h-item:hover { background: var(--surface); }
.h-item.active { background: var(--surface); border-color: var(--border2); }

.h-route {
  font-size: 9px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.07em;
  margin-bottom: 3px;
}
.h-route.retrieve { color: var(--green); }
.h-route.direct   { color: var(--accent); }
.h-route.multi_hop { color: var(--amber); }

.h-query {
  font-size: 12px; color: var(--ink2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.3;
}
.h-item.active .h-query { color: var(--ink); }

.empty-hist {
  padding: 20px 16px; font-size: 12px;
  color: var(--ink3); line-height: 1.6; text-align: center;
}

.sidebar-foot {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
}
.clear-btn {
  font-size: 11px; color: var(--ink3);
  background: none; border: none; cursor: pointer;
  font-family: inherit; padding: 0;
  transition: color 0.12s;
}
.clear-btn:hover { color: var(--red); }

/* ── MAIN ── */
main {
  display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg);
}

/* ── SEARCH ── */
.search-wrap {
  padding: 14px 24px 12px;
  border-bottom: 1px solid var(--border);
  background: #fff;
}

.search-box {
  display: flex; align-items: center;
  border: 1.5px solid var(--border2);
  border-radius: 8px;
  background: var(--bg);
  transition: border-color 0.15s, box-shadow 0.15s;
  overflow: hidden;
}
.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,57,246,0.08);
}

.search-icon { padding: 0 11px; color: var(--ink3); font-size: 16px; flex-shrink: 0; }

#q {
  flex: 1; border: none; outline: none;
  font-size: 14px; font-family: inherit;
  color: var(--ink); background: transparent;
  padding: 10px 0;
  min-width: 0;
}
#q::placeholder { color: var(--ink3); }

.search-hint {
  font-size: 11px; color: var(--border2);
  padding: 0 10px; flex-shrink: 0;
  font-family: var(--mono);
}

#go {
  padding: 0 18px; height: 42px;
  background: var(--accent); color: #fff;
  border: none; font-size: 13px; font-weight: 600;
  font-family: inherit; cursor: pointer;
  letter-spacing: -0.01em;
  transition: background 0.15s;
  flex-shrink: 0;
}
#go:hover { background: var(--accent3); }
#go:disabled { opacity: 0.35; cursor: not-allowed; }

.chips {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 10px;
}
.chip {
  font-size: 12px; padding: 4px 11px;
  border-radius: 20px; cursor: pointer;
  border: 1px solid var(--border2);
  background: #fff; color: var(--ink2);
  transition: all 0.12s; white-space: nowrap;
  font-weight: 500;
}
.chip:hover { background: var(--surface2); border-color: var(--ink3); color: var(--ink); }

/* ── ANSWER AREA ── */
.answer-area {
  flex: 1; overflow-y: auto;
  padding: 28px 32px;
}

/* empty */
.empty {
  height: 100%; display: flex;
  flex-direction: column; align-items: center;
  justify-content: center; gap: 6px; text-align: center;
}
.empty-title { font-size: 17px; font-weight: 600; color: var(--ink2); letter-spacing: -0.02em; }
.empty-sub { font-size: 13px; color: var(--ink3); max-width: 300px; line-height: 1.6; }

/* loading */
.loading { display: flex; flex-direction: column; gap: 14px; padding: 4px 0; }
.loading-row { display: flex; align-items: center; gap: 10px; }
.spinner {
  width: 15px; height: 15px; flex-shrink: 0;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-label { font-size: 13px; color: var(--ink2); }
.loading-label em { color: var(--ink); font-style: normal; font-weight: 500; }
.skel {
  height: 13px; border-radius: 4px;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* answer block */
.answer-block { max-width: 700px; }

/* meta row */
.meta-row {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 20px; gap: 8px; flex-wrap: wrap;
}
.meta-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.tag {
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 4px;
  letter-spacing: 0.01em;
  display: inline-flex; align-items: center; gap: 3px;
}
.tag.retrieve  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-b); }
.tag.direct    { background: var(--accent2); color: var(--accent); border: 1px solid #c4b8fb; }
.tag.multi_hop { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-b); }
.tag.iter      { background: var(--surface); color: var(--ink2); border: 1px solid var(--border2); }
.tag.grounded  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-b); }
.tag.partial   { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-b); }
.tag.gap       { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-b); }

.copy-ans {
  font-size: 11px; font-weight: 500;
  color: var(--ink3); background: #fff;
  border: 1px solid var(--border2); border-radius: 5px;
  padding: 4px 10px; cursor: pointer;
  font-family: inherit; transition: all 0.12s;
  white-space: nowrap;
}
.copy-ans:hover { color: var(--ink); border-color: var(--ink3); }

/* query echo */
.query-echo {
  font-size: 18px; font-weight: 700;
  color: var(--ink); letter-spacing: -0.02em;
  margin-bottom: 20px; line-height: 1.3;
}

/* divider between query and answer */
.answer-divider {
  width: 32px; height: 2px;
  background: var(--accent); border-radius: 2px;
  margin-bottom: 18px;
}

/* markdown */
.answer-content { color: var(--ink2); font-size: 14px; line-height: 1.75; }
.answer-content p { margin-bottom: 14px; color: var(--ink); }
.answer-content h1,.answer-content h2,.answer-content h3 {
  font-weight: 700; color: var(--ink);
  letter-spacing: -0.02em; margin: 22px 0 8px;
}
.answer-content h1 { font-size: 17px; }
.answer-content h2 { font-size: 15px; }
.answer-content h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink2); }
.answer-content ul,.answer-content ol { padding-left: 22px; margin-bottom: 14px; }
.answer-content li { margin-bottom: 5px; color: var(--ink); }
.answer-content strong { font-weight: 700; color: var(--ink); }
.answer-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.answer-content code {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--surface2); color: #c41a7f;
  padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--border);
}

/* code block */
.code-block {
  border-radius: 8px; overflow: hidden;
  border: 1px solid #2e2b3d;
  margin: 16px 0;
}
.code-header {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: #1e1c2a;
  border-bottom: 1px solid #2e2b3d;
}
.code-lang { font-size: 11px; color: #6b6882; font-family: var(--mono); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.copy-code {
  font-size: 11px; font-weight: 600;
  color: #9d97c0; background: rgba(255,255,255,0.06);
  border: none; border-radius: 4px;
  padding: 3px 9px; cursor: pointer;
  font-family: inherit; transition: all 0.12s;
  letter-spacing: 0.01em;
}
.copy-code:hover { color: #fff; background: rgba(255,255,255,0.12); }
.copy-code.copied { color: #4ade80; }

.answer-content pre {
  background: var(--code-dark);
  margin: 0; overflow-x: auto;
}
.answer-content pre code {
  display: block; padding: 16px;
  font-size: 13px; line-height: 1.65;
  color: #cdd6f4; background: none;
  border: none; white-space: pre;
}

/* scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink3); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-name">Agentic RAG</span>
    <span class="corpus-tag">FastAPI Docs</span>
  </div>
  <div class="header-stats">
    <span class="hstat"><b id="stat-q">0</b> queries</span>
    <span class="hstat"><b>202</b> chunks indexed</span>
    <span class="live"><span class="live-dot"></span>live</span>
  </div>
</header>

<aside>
  <div class="sidebar-label">History</div>
  <div class="history-scroll" id="hist"></div>
  <div class="sidebar-foot">
    <button class="clear-btn" onclick="clearAll()">Clear history</button>
  </div>
</aside>

<main>
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input id="q" type="text" placeholder="Ask anything about FastAPI..."
        autocomplete="off"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();go()}"/>
      <span class="search-hint">↵</span>
      <button id="go" onclick="go()">Search</button>
    </div>
    <div class="chips" id="chips">
      <span class="chip" onclick="fill('How do I add middleware in FastAPI?')">Middleware</span>
      <span class="chip" onclick="fill('How do I define path parameters?')">Path parameters</span>
      <span class="chip" onclick="fill('How does dependency injection work?')">Dependency injection</span>
      <span class="chip" onclick="fill('How do I write tests for FastAPI?')">Testing</span>
      <span class="chip" onclick="fill('How do I deploy FastAPI to production?')">Deployment</span>
      <span class="chip" onclick="fill('How do I define a response model?')">Response models</span>
    </div>
  </div>

  <div class="answer-area" id="area">
    <div class="empty">
      <div class="empty-title">Ask about FastAPI</div>
      <div class="empty-sub">Answers retrieved from official docs, verified for accuracy, and grounded in sources.</div>
    </div>
  </div>
</main>

<script>
marked.setOptions({ breaks: true });

let history = [], currentIdx = -1, queryCount = 0;
window._lastRaw = '';

function fill(q) {
  document.getElementById('q').value = q;
  document.getElementById('q').focus();
}

function go() {
  const query = document.getElementById('q').value.trim();
  if (!query) return;
  document.getElementById('q').value = '';
  document.getElementById('go').disabled = true;
  document.getElementById('chips').style.display = 'none';
  showLoading(query);
  queryCount++;
  document.getElementById('stat-q').textContent = queryCount;

  fetch('/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query })
  })
  .then(r => r.json())
  .then(data => { pushHistory(query, data); renderAnswer(query, data); })
  .catch(() => {
    document.getElementById('area').innerHTML =
      '<p style="color:var(--red);font-size:13px;padding:4px 0">Could not reach server. Check that uvicorn is running.</p>';
  })
  .finally(() => { document.getElementById('go').disabled = false; });
}

function showLoading(query) {
  document.getElementById('area').innerHTML = `
    <div class="loading">
      <div class="loading-row">
        <div class="spinner"></div>
        <span class="loading-label">Searching docs for <em>${esc(query)}</em></span>
      </div>
      <div class="skel" style="width:72%;height:13px"></div>
      <div class="skel" style="width:55%;height:13px"></div>
      <div class="skel" style="width:64%;height:13px"></div>
    </div>`;
}

function pushHistory(query, data) {
  history.unshift({ query, data });
  currentIdx = 0;
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('hist');
  if (!history.length) {
    el.innerHTML = '<div class="empty-hist">Your queries will appear here</div>';
    return;
  }
  el.innerHTML = history.map((h, i) => `
    <div class="h-item ${i === currentIdx ? 'active' : ''}" onclick="loadHistory(${i})">
      <div class="h-route ${h.data.route}">${h.data.route.replace('_',' ')}</div>
      <div class="h-query">${esc(h.query)}</div>
    </div>`).join('');
}

function loadHistory(i) {
  currentIdx = i;
  renderHistory();
  renderAnswer(history[i].query, history[i].data);
}

function clearAll() {
  history = []; currentIdx = -1; queryCount = 0;
  document.getElementById('stat-q').textContent = '0';
  renderHistory();
  document.getElementById('chips').style.display = 'flex';
  document.getElementById('area').innerHTML = `
    <div class="empty">
      <div class="empty-title">Ask about FastAPI</div>
      <div class="empty-sub">Answers retrieved from official docs, verified for accuracy, and grounded in sources.</div>
    </div>`;
}

function groundTag(critique) {
  if (!critique) return '';
  const scores = critique.map(c => c.score.split('\n')[0]);
  if (scores.every(s => s === 'fully_supported')) return '<span class="tag grounded">✓ fully grounded</span>';
  if (scores.some(s => s === 'not_supported'))    return '<span class="tag gap">⚠ gaps found</span>';
  return '<span class="tag partial">~ partially grounded</span>';
}

function processMarkdown(raw) {
  let parsed = marked.parse(raw);
  let ctr = 0;
  parsed = parsed.replace(/<pre><code([^>]*)>([\s\S]*?)<\/code><\/pre>/g, (_, attrs, code) => {
    const lang = (attrs.match(/class="language-(\w+)"/) || [])[1] || 'python';
    const id = 'cb' + (ctr++);
    return `<div class="code-block">
      <div class="code-header">
        <span class="code-lang">${lang}</span>
        <button class="copy-code" id="btn-${id}" onclick="copyCode('${id}','btn-${id}')">Copy</button>
      </div>
      <pre><code id="${id}"${attrs}>${code}</code></pre>
    </div>`;
  });
  return parsed;
}

function renderAnswer(query, data) {
  window._lastRaw = data.answer || '';
  const routeClass = data.route || 'retrieve';
  const routeLabel = routeClass.replace('_', ' ');
  const iters = data.iterations || 0;
  document.getElementById('area').innerHTML = `
    <div class="answer-block">
      <div class="query-echo">${esc(query)}</div>
      <div class="answer-divider"></div>
      <div class="meta-row">
        <div class="meta-tags">
          <span class="tag ${routeClass}">${routeLabel}</span>
          <span class="tag iter">${iters} iteration${iters !== 1 ? 's' : ''}</span>
          ${groundTag(data.critique)}
        </div>
        <button class="copy-ans" onclick="copyAnswer(this)">Copy answer</button>
      </div>
      <div class="answer-content">${processMarkdown(data.answer || '')}</div>
    </div>`;
  document.getElementById('area').scrollTop = 0;
}

function copyCode(id, btnId) {
  const code = document.getElementById(id);
  if (!code) return;
  navigator.clipboard.writeText(code.innerText).then(() => {
    const btn = document.getElementById(btnId);
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}

function copyAnswer(btn) {
  navigator.clipboard.writeText(window._lastRaw).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy answer', 1800);
  });
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

renderHistory();
document.getElementById('q').focus();
</script>
</body>
</html>
